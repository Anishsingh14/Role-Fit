name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: pytest -v

      - name: Run end-to-end pipeline on sample resume
        run: python main.py sample_resume.docx --out ci_output

      - name: Verify expected outputs were generated
        run: |
          test -f ci_output/report.json
          test -f ci_output/01_top_job_matches.png
          test -f ci_output/02_skill_gap_bar.png
          test -f ci_output/03_readiness_donut.png
          test -f ci_output/04_skill_radar.png
          test -f ci_output/05_highest_impact_missing_skills.png
          test -f ci_output/06_pca_job_space.png
          echo "All expected output files were generated successfully."
